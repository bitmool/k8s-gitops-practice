apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hello-msa
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: hello-msa
        image: ghcr.io/bitmool/k8s-gitops-practice/hello-msa:latest
        ports:
        - containerPort: 3000
        env:
        - name: ENV_NAME
          value: "Development 🛠️"
